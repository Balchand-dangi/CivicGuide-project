spring.application.name=civic-guide-backend
# PostgreSQL database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/civicguide
spring.datasource.username=UserName
spring.datasource.password=UserPassword

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true 

jwt.secret=JwtSecretKey
jwt.access-token-expiration=900000  

# Server
server.port=8080
# Optional: seed the first ADMIN account from environment variables.
# CIVICGUIDE_ADMIN_EMAIL=admin@example.com
# CIVICGUIDE_ADMIN_PASSWORD=change-this
civicguide.admin.email=${CIVICGUIDE_ADMIN_EMAIL:}
civicguide.admin.password=${CIVICGUIDE_ADMIN_PASSWORD:}